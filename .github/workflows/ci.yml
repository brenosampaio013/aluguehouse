name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verificar:
    name: Lint, tipos, formatação e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  e2e:
    name: Build e testes de ponta a ponta (com Supabase local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir Supabase local (banco, auth, API, storage e e-mail de teste)
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Gerar .env.local com as chaves locais de teste
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|MAILPIT_URL)=')"
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "MAILPIT_URL=$MAILPIT_URL"
          } > .env.local

      - name: Build do Next.js
        run: pnpm build

      - name: Nenhum segredo no código do navegador
        run: set -a && . ./.env.local && set +a && scripts/check-client-bundle.sh

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes de ponta a ponta (desktop, tablet e celular)
        run: pnpm test:e2e

      - name: Build para Cloudflare Workers
        run: pnpm cf:build

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  banco:
    name: Banco de dados (migrations, lint e pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O deploy (`supabase db push`) recusa migration com timestamp anterior
      # à última aplicada em produção: barra isso já no PR.
      - name: Ordem das migrations novas
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          scripts/check-migration-order.sh FETCH_HEAD

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Subir Postgres local com as migrations
        run: supabase db start

      - name: Lint das funções SQL
        run: supabase db lint --level warning --fail-on warning

      - name: Testes pgTAP (RLS, calendário, preços, avaliações, storage)
        run: supabase test db

  backup:
    name: Backup e restauração (ida e volta)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Ferramentas (age e psql)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age postgresql-client

      - name: Subir Supabase local
        run: supabase start -x studio,realtime,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Dados de exemplo → backup → banco zerado → restauração → conferência
        run: scripts/backup/roundtrip-test.sh

  segredos:
    name: Busca de segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
