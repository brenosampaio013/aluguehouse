<!doctype html>
<html lang="pt-BR">
  <body
    style="
      margin: 0;
      padding: 32px 16px;
      background: #ffffff;
      color: #0d3b45;
      font-family: Arial, Helvetica, sans-serif;
    "
  >
    <p style="font-family: Georgia, serif; font-size: 22px; margin: 0 0 24px">Alugue Houses</p>
    <p style="font-size: 16px; line-height: 1.6; margin: 0 0 24px">
      Use o botão abaixo para entrar na sua conta. O link vale por 1 hora e só funciona uma vez.
    </p>
    <p style="margin: 0 0 24px">
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=email"
        style="
          display: inline-block;
          background: #13606e;
          color: #ffffff;
          text-decoration: none;
          font-weight: bold;
          padding: 14px 22px;
          border-radius: 8px;
        "
      >
        Entrar na Alugue Houses
      </a>
    </p>
    <p style="font-size: 13px; line-height: 1.45; color: #52666a; margin: 0">
      Se você não pediu este acesso, ignore este e-mail.
    </p>
  </body>
</html>
